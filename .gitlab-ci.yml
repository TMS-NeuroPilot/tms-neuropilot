# GitLab CI -- syntax gate plus the headless test suite.
#
# The suite imports PyQt5, pynibs, simnibs and mujoco at collection time, so
# the jobs need the project's `pipeline` conda environment (see README).
# scripts/ci-python.sh finds it automatically (or set PYTHON in the CI/CD
# variables to an absolute path); nothing is installed by the pipeline.
#
# GUI tests (marked `gui`) build a real window and need an X display.  They
# run only in the optional, manual `test:gui` job, i.e. on a runner with a
# display (a lab workstation rather than a shared CI runner).

stages:
  - check
  - test
  - deploy

variables:
  # Empty -> scripts/ci-python.sh looks for the `pipeline` env.
  PYTHON: ""
  # Keep every artefact out of the runner's home directory, and do not let a
  # checked-out .env or a developer's lab profile influence the run.
  ROOT_FOLDER: "$CI_PROJECT_DIR/.ci-data"
  NEUROPILOT_LAB_FILE: "$CI_PROJECT_DIR/.ci-data/lab.yaml"
  NEUROPILOT_ENV_FILE: "$CI_PROJECT_DIR/.ci-data/.env"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

default:
  interruptible: true
  before_script:
    - PYTHON=$(bash scripts/ci-python.sh)
    # Quoted: an unquoted "Interpreter: ..." is a YAML mapping, which makes the
    # whole pipeline invalid (GitLab then runs no job at all).
    - 'echo "Interpreter: $PYTHON ($($PYTHON --version 2>&1))"'
    - '$PYTHON -c "import pytest" || { echo "pytest is not installed in $PYTHON -- point PYTHON at the pipeline env"; exit 1; }'


# Cheap and dependency-free: catches a syntax error even on a runner where the
# heavy imports are unavailable.
check:syntax:
  stage: check
  # The shared runners use a bare alpine default image (no bash, no Python),
  # so every job that needs Python pins one.  python:3.11 also matches the
  # project's requires-python and provides tomllib.
  image: python:3.11-alpine
  before_script: []
  script:
    - python3 -m compileall -q src/neuropilot && echo "syntax OK"
    - python3 -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print('pyproject.toml OK')"

# The documentation site is built with a dependency-free generator
# (docs/site/build.py).  This job only checks it: no network, no packages, and
# a failure means a broken link, an orphan page or a missing nav entry.
check:docs:
  stage: check
  # The site builder is standard-library only: no pytest, no conda env and no
  # bash.  This runs on any shared runner.
  image: python:3.11-alpine
  before_script: []
  script:
    - python3 docs/site/build.py --check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# The full headless suite runs on a **lab workstation runner** — a
# gitlab-runner with the `lab` tag and a *shell* executor, registered on a
# lab PC where the project's `pipeline` conda environment exists
# (scripts/ci-python.sh finds it).  It runs once a day from the nightly
# pipeline schedule (CI/CD -> Schedules, cron 0 9 * * *) and can be started
# by hand from any pipeline view.  Every push runs only the cheap gates
# above; nothing is installed by the pipeline, so a shared runner cannot
# run this job (no `pipeline` env) and the fake-green skip it used to
# report is gone.
test:
  stage: test
  tags:
    - lab
  before_script: []
  script:
    - PYTHON=$(bash scripts/ci-python.sh)
    # The suite imports PyQt5, pynibs, simnibs and mujoco, which only the
    # `pipeline` environment has.  Fail loudly if the workstation env is
    # missing instead of reporting a skip as success.
    - '$PYTHON -c "import PyQt5, pynibs, simnibs, mujoco" || { echo "lab Python environment not available on this runner"; exit 1; }'
    - mkdir -p "$ROOT_FOLDER"
    - '$PYTHON -m pytest -m "not gui" -q --junitxml=report.xml'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
  rules:
    # Once a day: the nightly schedule on the lab workstation.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Startable by hand from the pipeline view (only the lab runner picks
    # this job up - it carries the `lab` tag).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH'
      when: manual

# GitLab Pages: publish the documentation site.  The `pages` job name and the
# `public` artifact are what GitLab expects; the build needs no network.
pages:
  stage: deploy
  image: python:3.11-alpine
  # Deploy the docs independently of the heavy test stage: a runner without
  # the `pipeline` conda env can still publish the site.  `build.py` already
  # fails on broken links, so the artifact is checked by construction.
  needs: []
  before_script: []
  script:
    - python3 docs/site/build.py --out public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# The GUI tests build real Qt windows and need OpenGL and a display: run on
# the lab workstation runner (the same `lab`-tagged shell runner as `test`),
# once a day from the nightly schedule and by hand from the pipeline view.
test:gui:
  stage: test
  tags:
    - lab
  when: manual
  allow_failure: true
  before_script: []
  script:
    - PYTHON=$(bash scripts/ci-python.sh)
    - '$PYTHON -c "import PyQt5" || { echo "PyQt5/display not available on this runner"; exit 1; }'
    - mkdir -p "$ROOT_FOLDER"
    - '$PYTHON -m pytest -m gui -q --junitxml=report-gui.xml'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report-gui.xml
  rules:
    # Once a day: the nightly schedule on the lab workstation.  `when: always`
    # overrides the job-level `manual` so the schedule really runs it.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

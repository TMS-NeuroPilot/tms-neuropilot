# GitLab CI -- cheap gates on every push, the full test suite once a day.
#
# The gates (syntax, docs check) are dependency-free and run on the shared
# runners.  The `test` job installs the heavy stack itself
# (requirements-ci.txt + the SimNIBS wheel) and runs the headless suite once
# a day from the nightly pipeline schedule, or by hand from any pipeline
# view.
#
# GUI tests (marked `gui`) build a real window and need a display.  On the
# display-less shared runners they simply skip (the suite's conftest skips
# them without DISPLAY); the job stays manual and is allowed to fail.

stages:
  - check
  - test
  - deploy

variables:
  # Empty -> scripts/ci-python.sh looks for the `neuropilot` env.
  PYTHON: ""
  # Keep every artefact out of the runner's home directory, and do not let a
  # checked-out .env or a developer's lab profile influence the run.
  ROOT_FOLDER: "$CI_PROJECT_DIR/.ci-data"
  NEUROPILOT_LAB_FILE: "$CI_PROJECT_DIR/.ci-data/lab.yaml"
  NEUROPILOT_ENV_FILE: "$CI_PROJECT_DIR/.ci-data/.env"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # The shared runner ran out of disk while archiving a successful test job.
  # Keep the checkout and pip's download cache small: the wheels are fetched
  # fast enough that a persistent cache is not worth the local disk cost.
  GIT_DEPTH: "1"
  PIP_NO_CACHE_DIR: "1"

default:
  interruptible: true
  before_script:
    - PYTHON=$(bash scripts/ci-python.sh)
    # Quoted: an unquoted "Interpreter: ..." is a YAML mapping, which makes the
    # whole pipeline invalid (GitLab then runs no job at all).
    - 'echo "Interpreter: $PYTHON ($($PYTHON --version 2>&1))"'
    - '$PYTHON -c "import pytest" || { echo "pytest is not installed in $PYTHON -- point PYTHON at the neuropilot env"; exit 1; }'


# Cheap and dependency-free: catches a syntax error even on a runner where the
# heavy imports are unavailable.
check:syntax:
  stage: check
  # The shared runners use a bare alpine default image (no bash, no Python),
  # so every job that needs Python pins one.  python:3.11 also matches the
  # project's requires-python and provides tomllib.
  image: python:3.11-alpine
  before_script: []
  script:
    - python3 -m compileall -q src/neuropilot && echo "syntax OK"
    - python3 -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print('pyproject.toml OK')"

# The documentation site is built with a dependency-free generator
# (docs/site/build.py).  This job only checks it: no network, no packages, and
# a failure means a broken link, an orphan page or a missing nav entry.
check:docs:
  stage: check
  # The site builder is standard-library only: no pytest, no conda env and no
  # bash.  This runs on any shared runner.
  image: python:3.11-alpine
  before_script: []
  script:
    - python3 docs/site/build.py --check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# The full headless suite runs on the **shared runners**: the job installs
# the heavy stack itself (requirements-ci.txt + the SimNIBS wheel; nothing
# is preinstalled there).  It runs once a day from the nightly pipeline
# schedule (CI/CD -> Schedules, cron 0 9 * * *) and can be started by hand
# from any pipeline view.  Every push runs only the cheap gates above - the
# old push `test` job reported a fake green (the heavy imports were absent,
# so it skipped the suite and still said success).
test:
  stage: test
  # The full Debian-based python image: apt-get for git/gfortran, pip for
  # the stack.  The runner's default image is alpine (no apt-get, no pip).
  image: python:3.11
  before_script: []
  # python-mumps compiles MUMPS against the system library: the image needs
  # a Fortran compiler AND libmumps-dev.  libgl1 (headless import of mujoco
  # and PyQt5) and libglib2.0-0 come from apt too.  git lets pip fetch
  # pynibs from the group's GitLab.
  script:
    - apt-get update -qq && apt-get install -y -qq git gfortran libmumps-dev libgl1 libglib2.0-0 libxkbcommon0 > /dev/null
    - apt-get clean && rm -rf /var/lib/apt/lists/*
    - pip install -r requirements-ci.txt
    # The SimNIBS wheel declares petsc4py as a build dependency; with
    # isolation pip rebuilds it against numpy 2.x and fails.  The wheel from
    # requirements-ci.txt is already installed, so build without isolation.
    - pip install --no-build-isolation "simnibs @ https://github.com/simnibs/simnibs/releases/download/v4.5.0/simnibs-4.5.0-cp311-cp311-linux_x86_64.whl"
    - pip install python-mumps
    # The pinned 2024 mkl and the pip tbb wheel ship their libs without a
    # loader path; numba and the SimNIBS/pynibs extensions need them.
    - MKLLIB="$(dirname "$(find /usr/local/lib -name 'libmkl_intel_lp64.so.2' | head -1)")"
    - TBBLIB="$(dirname "$(find /usr/local/lib -name 'libtbb.so.12*' | head -1)")"
    - export LD_LIBRARY_PATH="$MKLLIB:$TBBLIB:${LD_LIBRARY_PATH:-}"
    - mkdir -p "$ROOT_FOLDER"
    - python3 -m pytest -m "not gui" -q --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
  rules:
    # Once a day: the nightly schedule.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Startable by hand from the pipeline view.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH'
      when: manual
# The docs site is published from GitHub Pages (see
# .github/workflows/pages.yml); GitLab CI only checks its links, in
# check:docs above.  GitLab's own Pages deployment was retired when the
# public mirror moved to GitHub.

# The GUI tests build real Qt windows and need OpenGL and a display: run on
# the lab workstation runner (the same `lab`-tagged shell runner as `test`),
# once a day from the nightly schedule and by hand from the pipeline view.
test:gui:
  stage: test
  when: manual
  allow_failure: true
  # Debian-based image: the script uses bash; the shared Alpine default image
  # has neither bash nor the lab conda env.
  image: python:3.11
  before_script: []
  script:
    - PYTHON=$(bash scripts/ci-python.sh)
    - '$PYTHON -c "import PyQt5" || { echo "PyQt5/display not available on this runner"; exit 1; }'
    - mkdir -p "$ROOT_FOLDER"
    - '$PYTHON -m pytest -m gui -q --junitxml=report-gui.xml'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report-gui.xml
  rules:
    # Once a day: the nightly schedule on the lab workstation.  `when: always`
    # overrides the job-level `manual` so the schedule really runs it.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

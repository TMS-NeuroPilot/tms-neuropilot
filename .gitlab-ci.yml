# GitLab CI -- syntax gate plus the headless test suite.
#
# The suite imports PyQt5, pynibs, simnibs and mujoco at collection time, so
# the jobs need the project's `pipeline` conda environment (see README).
# scripts/ci-python.sh finds it automatically (or set PYTHON in the CI/CD
# variables to an absolute path); nothing is installed by the pipeline.
#
# GUI tests (marked `gui`) build a real window and need an X display.  They
# run only in the optional, manual `test:gui` job, i.e. on a runner with a
# display (a lab workstation rather than a shared CI runner).

stages:
  - check
  - test

variables:
  # Empty -> scripts/ci-python.sh looks for the `pipeline` env.
  PYTHON: ""
  # Keep every artefact out of the runner's home directory, and do not let a
  # checked-out .env or a developer's lab profile influence the run.
  ROOT_FOLDER: "$CI_PROJECT_DIR/.ci-data"
  NEUROPILOT_LAB_FILE: "$CI_PROJECT_DIR/.ci-data/lab.yaml"
  NEUROPILOT_ENV_FILE: "$CI_PROJECT_DIR/.ci-data/.env"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

default:
  interruptible: true
  before_script:
    - PYTHON=$(bash scripts/ci-python.sh)
    - echo "Interpreter: $PYTHON ($($PYTHON --version 2>&1))"
    - $PYTHON -c "import pytest" || { echo "pytest is not installed in $PYTHON -- point PYTHON at the pipeline env"; exit 1; }

# Cheap and dependency-free: catches a syntax error even on a runner where the
# heavy imports are unavailable.
check:syntax:
  stage: check
  script:
    - $PYTHON -m compileall -q src/neuropilot && echo "syntax OK"
    - $PYTHON -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print('pyproject.toml OK')"

test:
  stage: test
  script:
    - mkdir -p "$ROOT_FOLDER"
    - $PYTHON -m pytest -m "not gui" -q --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Optional: run on a machine with a display (the six-page snapshot test needs
# OpenGL, so a headless runner is not enough).  Start it by hand from the
# pipeline view.
test:gui:
  stage: test
  when: manual
  allow_failure: true
  script:
    - mkdir -p "$ROOT_FOLDER"
    - $PYTHON -m pytest -m gui -q --junitxml=report-gui.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report-gui.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  # Uncomment and set the tag of a runner that has a display:
  # tags:
  #   - workstation

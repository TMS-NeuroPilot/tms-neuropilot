# Check the Developer Certificate of Origin sign-off on pull requests.
#
# GitHub is a read-only mirror of the development repository, so this check is
# a courtesy for contributors rather than a gate: it tells them early that
# every commit needs a `Signed-off-by` trailer (see .github/CONTRIBUTING.md and
# the DCO file at the repository root).
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit must carry Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git log -1 --format='%B' "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::missing Signed-off-by in $(git log -1 --format='%h %s' "$c")"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Fix with: git commit --amend -s   (or: git rebase --signoff)"
          fi
          exit "$bad"

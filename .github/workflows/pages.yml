# Publish the documentation site to the organisation's root GitHub Pages site.
#
# The site is generated by docs/site/build.py, which is dependency-free, so the
# job needs nothing but a Python interpreter. This repository is the public
# mirror of the project; the served site lives in the repository
# TMS-NeuroPilot/tms-neuropilot.github.io, which GitHub turns into the
# organisation root site at https://tms-neuropilot.github.io/.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SITE_REPO: github.com/TMS-NeuroPilot/tms-neuropilot.github.io.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the site
        run: python docs/site/build.py --out _site
      - name: Publish to the root Pages repository
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          cd _site
          touch .nojekyll
          printf '# TMS NeuroPilot documentation site\n\nGenerated by the `Docs` workflow in\n[TMS-NeuroPilot/tms-neuropilot](https://github.com/TMS-NeuroPilot/tms-neuropilot)\nfrom `docs/site/`. Do not edit this repository by hand: every publish\nreplaces its contents.\n' > README.md
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish docs from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${PAGES_TOKEN}@${SITE_REPO}" main

# Publish the documentation site to GitHub Pages, two sites from one source:
#
#   dev  -> https://tms-neuropilot.github.io/tms-neuropilot/  (development docs,
#           the repository's own Pages site, served from the gh-pages branch,
#           noindex so it does not compete with the release site)
#   main -> https://tms-neuropilot.github.io/                 (release docs, the
#           organisation root site, served from TMS-NeuroPilot/tms-neuropilot.github.io)
#
# docs/site/build.py is dependency-free, so both jobs need only a Python
# interpreter. This repository is the public mirror of the project.
name: Docs

on:
  push:
    branches: [dev, main]
    paths:
      - "docs/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the built site to gh-pages in this repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the development site
        run: >-
          python docs/site/build.py --out _site --noindex
          --site-url https://tms-neuropilot.github.io/tms-neuropilot/
      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Development docs from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the release site
        run: python docs/site/build.py --out _site
      - name: Publish to the root Pages repository
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          cd _site
          touch .nojekyll
          printf '# TMS NeuroPilot documentation site\n\nGenerated by the `Docs` workflow in\n[TMS-NeuroPilot/tms-neuropilot](https://github.com/TMS-NeuroPilot/tms-neuropilot)\nfrom `docs/site/`. Do not edit this repository by hand: every publish\nreplaces its contents. The development documentation lives at\n<https://tms-neuropilot.github.io/tms-neuropilot/>.\n' > README.md
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish docs from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${PAGES_TOKEN}@github.com/TMS-NeuroPilot/tms-neuropilot.github.io.git" main

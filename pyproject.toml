[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neuropilot"
version = "0.1.0"
description = "TMS NeuroPilot — guided online TMS mapping with online field optimization"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "python-socketio",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
# Heavy scientific dependencies (PyQt5, qasync, pyvista, mujoco, pybullet,
# ikpy, pynibs, magicpy, ...) come from the conda `pipeline` environment.
# Install with:  pip install -e . --no-deps
gui = ["PyQt5", "qasync"]
sim = ["mujoco", "pybullet", "ikpy"]
dev = ["pytest>=8", "pytest-xdist>=3.6"]

[project.scripts]
neuropilot = "neuropilot.cli:main"

[project.urls]
Homepage = "https://github.com/0nu/tms-neuropilot"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default: as many workers as useful, 8 processes at most.
# A single run still finishes faster, and the suite needs no special
# invocation.  Serial with -p no:xdist or -n0 when a run must be watched.
addopts = ["-n", "auto", "--maxprocesses=8"]
markers = [
    "gui: builds a real Qt window (needs a display, skipped without one)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neuropilot.sim_robot" = ["assets/**/*"]
"neuropilot.controller" = ["gui/*.png", "gui/*.ui"]

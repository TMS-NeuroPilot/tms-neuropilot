<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 900" width="560" height="900" role="img" aria-label="The mapping loop (vertical)"><title>The mapping loop (vertical)</title><rect width="560" height="900" rx="12" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A636E"/></marker></defs><text x="280" y="24" font-size="17" font-weight="700" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">One pulse = one pass through the loop</text><rect x="170" y="70" width="220" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="109.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">INIT</text><rect x="170" y="160" width="220" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="191.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SEND</text><text x="280.0" y="207.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">MARKER</text><path d="M 280.0 140.0 L 280.0 160.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="170" y="250" width="220" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="281.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">START</text><text x="280.0" y="297.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">TRACKING</text><path d="M 280.0 230.0 L 280.0 250.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="170" y="340" width="220" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="371.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">WAIT FOR</text><text x="280.0" y="387.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">TARGET</text><path d="M 280.0 320.0 L 280.0 340.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="170" y="430" width="220" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="461.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">FIRE</text><text x="280.0" y="477.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">STIM</text><path d="M 280.0 410.0 L 280.0 430.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="170" y="520" width="220" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="551.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">COLLECT</text><text x="280.0" y="567.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">DATA</text><path d="M 280.0 500.0 L 280.0 520.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="170" y="610" width="220" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="280.0" y="649.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">ANALYSE</text><path d="M 280.0 590.0 L 280.0 610.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="170" y="700" width="220" height="70" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/><text x="280.0" y="739.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">COMPLETE</text><path d="M 280.0 680.0 L 280.0 700.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 280.0 770 L 280.0 810" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 280.0 810 L 70 810" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 70 810 L 70 105.0" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 70 105.0 L 168 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><text x="280" y="834" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">next target / next repetition</text><path d="M 390.0 285.0 L 470 285.0" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 470 285.0 L 470 735.0" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 470 735.0 L 392 735.0" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="482" y="500" font-size="11" font-weight="500" fill="#5A636E" text-anchor="start" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SKIP / Next</text><text x="482" y="516" font-size="11" font-weight="500" fill="#5A636E" text-anchor="start" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">→ COMPLETE</text><text x="280" y="870" font-size="12" font-weight="400" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">WAIT FOR TARGET needs coil-at-target + force +</text><text x="280" y="888" font-size="12" font-weight="400" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">minimum interval.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" width="640" height="680" role="img" aria-label="The mapping loop (vertical)"><title>The mapping loop (vertical)</title><rect width="640" height="680" rx="12" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A636E"/></marker></defs><text x="320" y="28" font-size="17" font-weight="700" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">One pulse = one pass through the loop</text><rect x="70" y="70" width="220" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="180.0" y="106.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">INIT</text><rect x="350" y="70" width="220" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="460.0" y="106.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">LOAD TARGET</text><rect x="70" y="170" width="220" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="180.0" y="206.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">START TRACKING</text><rect x="350" y="170" width="220" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="460.0" y="206.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SEND MARKER</text><rect x="70" y="270" width="220" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="180.0" y="306.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">WAIT FOR TARGET REACHED</text><rect x="350" y="270" width="220" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="460.0" y="306.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">FIRE TMS PULSE</text><rect x="70" y="370" width="220" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="180.0" y="406.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">ANALYSE</text><rect x="350" y="370" width="220" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="460.0" y="406.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">COLLECT DATA</text><rect x="70" y="470" width="220" height="64" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/><text x="180.0" y="506.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">COMPLETE</text><path d="M 290 102.0 L 350 102.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 460.0 134 L 460.0 170" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 350 202.0 L 290 202.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 180.0 234 L 180.0 270" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 290 302.0 L 350 302.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 460.0 334 L 460.0 370" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 350 402.0 L 290 402.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 180.0 434 L 180.0 470" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 180.0 534 L 180 580" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 180 580 L 600 580" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 600 580 L 600 102.0" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 600 102.0 L 572 102.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><text x="380" y="600" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">next target / next repetition</text><path d="M 70 202.0 L 40 202.0" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 40 202.0 L 40 502.0" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 40 502.0 L 68 502.0" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="50" y="352" font-size="11" font-weight="500" fill="#5A636E" text-anchor="start" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SKIP / Next</text><text x="320" y="636" font-size="12" font-weight="400" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">WAIT FOR TARGET REACHED needs coil-at-target + force +</text><text x="320" y="654" font-size="12" font-weight="400" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">minimum interval.</text></svg>

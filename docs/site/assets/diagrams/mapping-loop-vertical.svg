<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 590" width="620" height="590" role="img" aria-label="The mapping loop (2 x 4)"><title>The mapping loop (2 x 4)</title><rect width="620" height="590" rx="12" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A636E"/></marker></defs><text x="310" y="26" font-size="17" font-weight="700" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">One pulse = one pass through the loop</text><rect x="80" y="70" width="180" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="170.0" y="106.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">INIT</text><rect x="320" y="70" width="180" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="410.0" y="98.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SEND</text><text x="410.0" y="114.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">MARKER</text><rect x="80" y="170" width="180" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="170.0" y="198.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">WAIT FOR</text><text x="170.0" y="214.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">TARGET</text><rect x="320" y="170" width="180" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="410.0" y="198.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">START</text><text x="410.0" y="214.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">TRACKING</text><rect x="80" y="270" width="180" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="170.0" y="298.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">FIRE</text><text x="170.0" y="314.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">STIM</text><rect x="320" y="270" width="180" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="410.0" y="298.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">COLLECT</text><text x="410.0" y="314.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">DATA</text><rect x="80" y="370" width="180" height="64" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/><text x="170.0" y="406.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">COMPLETE</text><rect x="320" y="370" width="180" height="64" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="410.0" y="406.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">ANALYSE</text><path d="M 260 102.0 L 320 102.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 410.0 134 L 410.0 170" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 320 202.0 L 260 202.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 170.0 234 L 170.0 270" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 260 302.0 L 320 302.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 410.0 334 L 410.0 370" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 320 402.0 L 260 402.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 170.0 434 L 170 500" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 170 500 L 40 500" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 40 500 L 40 102.0" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 40 102.0 L 78 102.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><text x="310" y="518" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">next target / next repetition</text><path d="M 500 202.0 L 550 202.0" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 550 202.0 L 550 460" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 550 460 L 210 460" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 210 460 L 210 436" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="380" y="452" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SKIP / Next  →  COMPLETE (abandon this target)</text><text x="310" y="550" font-size="12" font-weight="400" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">WAIT FOR TARGET needs coil-at-target + force +</text><text x="310" y="568" font-size="12" font-weight="400" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">minimum interval.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="The mapping loop"><title>The mapping loop</title><rect width="1000" height="250" rx="12" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A636E"/></marker></defs><text x="500" y="24" font-size="17" font-weight="700" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">One pulse = one pass through the loop</text><rect x="24" y="70" width="104" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="76.0" y="109.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">INIT</text><rect x="145" y="70" width="104" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="197.0" y="101.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SEND</text><text x="197.0" y="117.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">MARKER</text><path d="M 130.0 105.0 L 143.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="266" y="70" width="104" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="318.0" y="101.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">START</text><text x="318.0" y="117.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">TRACKING</text><path d="M 251.0 105.0 L 264.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="387" y="70" width="104" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="439.0" y="101.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">WAIT FOR</text><text x="439.0" y="117.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">TARGET</text><path d="M 372.0 105.0 L 385.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="508" y="70" width="104" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="560.0" y="101.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">FIRE</text><text x="560.0" y="117.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">STIM</text><path d="M 493.0 105.0 L 506.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="629" y="70" width="104" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="681.0" y="101.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">COLLECT</text><text x="681.0" y="117.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">DATA</text><path d="M 614.0 105.0 L 627.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="750" y="70" width="104" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="802.0" y="109.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">ANALYSE</text><path d="M 735.0 105.0 L 748.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="871" y="70" width="104" height="70" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/><text x="923.0" y="109.0" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">COMPLETE</text><path d="M 856.0 105.0 L 869.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 923.0 70 L 923.0 52" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 923.0 52 L 76.0 52" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 76.0 52 L 76.0 70" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><text x="500.0" y="46" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">next target / next repetition</text><path d="M 318.0 140 L 318.0 178" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 318.0 178 L 923.0 178" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 923.0 178 L 923.0 142" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="500.0" y="198" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SKIP / Next  →  COMPLETE (abandon this target)</text><text x="500.0" y="232" font-size="12" font-weight="400" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">WAIT FOR TARGET needs coil-at-target + force + minimum interval.</text></svg>

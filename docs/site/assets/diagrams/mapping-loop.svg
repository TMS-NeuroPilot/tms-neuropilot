<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1780 250" width="1780" height="250" role="img" aria-label="The mapping loop"><title>The mapping loop</title><rect width="1780" height="250" rx="12" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A636E"/></marker></defs><text x="890" y="24" font-size="17" font-weight="700" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">One pulse = one pass through the loop</text><rect x="22" y="70" width="180" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="112.0" y="108.66666666666667" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">INIT</text><rect x="214" y="70" width="180" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="304.0" y="108.66666666666667" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">LOAD TARGET</text><path d="M 204.0 105.0 L 212.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="406" y="70" width="180" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="496.0" y="108.66666666666667" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SEND MARKER</text><path d="M 396.0 105.0 L 404.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="598" y="70" width="180" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="688.0" y="108.66666666666667" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">START TRACKING</text><path d="M 588.0 105.0 L 596.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="790" y="70" width="180" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="880.0" y="108.66666666666667" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">WAIT FOR TARGET REACHED</text><path d="M 780.0 105.0 L 788.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="982" y="70" width="180" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="1072.0" y="108.66666666666667" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">FIRE TMS PULSE</text><path d="M 972.0 105.0 L 980.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1174" y="70" width="180" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="1264.0" y="108.66666666666667" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">COLLECT DATA</text><path d="M 1164.0 105.0 L 1172.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1366" y="70" width="180" height="70" rx="10" fill="#F2F4F6" stroke="#C6CCD4" stroke-width="1.4"/><text x="1456.0" y="108.66666666666667" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">ANALYSE</text><path d="M 1356.0 105.0 L 1364.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="1558" y="70" width="180" height="70" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/><text x="1648.0" y="108.66666666666667" font-size="11" font-weight="600" fill="#1B1F24" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">COMPLETE</text><path d="M 1548.0 105.0 L 1556.0 105.0" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 1648.0 70 L 1648.0 52" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 1648.0 52 L 304.0 52" fill="none" stroke="#5A636E" stroke-width="1.6"/><path d="M 304.0 52 L 304.0 70" fill="none" stroke="#5A636E" stroke-width="1.6" marker-end="url(#arrow)"/><text x="890.0" y="46" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">next target / next repetition</text><path d="M 688.0 140 L 688.0 178" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 688.0 178 L 1648.0 178" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 1648.0 178 L 1648.0 142" fill="none" stroke="#5A636E" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="890.0" y="198" font-size="11" font-weight="500" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">SKIP / Next  →  COMPLETE (abandon this target)</text><text x="890.0" y="232" font-size="12" font-weight="400" fill="#5A636E" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', system-ui, sans-serif">WAIT FOR TARGET REACHED needs coil-at-target + force + minimum interval.</text></svg>

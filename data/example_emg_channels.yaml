# Example EMG channel-source configuration
# (Project tab -> "EMG channels" -> ... -> select this file).
#
# One entry per channel, assigned POSITIONALLY to the channel names in
# EMG_CHANNELS from .env (default: FDI,APB,ADM).  Each entry names the
# cortical source of that channel in one of two ways:
#
#   element_id: <int>     index into the loaded ROI surface elements
#                         (the same order as the E-field library columns)
#   xyz: [x, y, z]        position in mm in SimNIBS space; the closest
#                         ROI element is projected and used
#
# Default channels: FDI, APB, ADM -> same sources the simulated EMG uses
# when no config is loaded.

sources:
  - element_id: 5208   # FDI - left M1 hand knob
  - element_id: 5165   # APB
  - element_id: 4456   # ADM

# Alternative, position based.  These are the triangle centres of the
# three elements above in the ernie ROI, so they resolve to the same
# sources (the projection prints element and distance):
#
# sources:
#   - xyz: [-25.1, 15.5, 55.8]   # -> element 5208
#   - xyz: [-36.7, -4.2, 60.3]   # -> element 5165
#   - xyz: [-16.2, 14.6, 61.9]   # -> element 4456
